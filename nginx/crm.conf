server {
    listen 80;
    server_name _;
    root /var/www/crm/dist;
    index index.html;

    # Прокси для Supabase (обход блокировок в РФ)
    location /supabase-proxy/ {
        proxy_pass https://mtigcxqcymxvqjjqfyts.supabase.co/;
        proxy_ssl_server_name on;
        proxy_ssl_name mtigcxqcymxvqjjqfyts.supabase.co;

        # Обязательно для корректного проксирования на HTTPS-бэкенд
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host mtigcxqcymxvqjjqfyts.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Явно пробрасываем заголовки Supabase (apikey, Authorization, Prefer)
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Prefer $http_prefer;

        # Без буферизации — для стриминга и корректной передачи тела запроса
        proxy_buffering off;
        proxy_request_buffering off;

        # Таймауты
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Запрещаем браузеру кешировать API-ответы
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA fallback — все маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
