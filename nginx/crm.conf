server {
    listen 80;
    server_name _;
    root /var/www/crm/dist;
    index index.html;

    # Лимит размера загружаемых файлов (фото, документы)
    client_max_body_size 50m;

    # DNS-резолвер: без него nginx кешит IP Supabase навсегда → таймауты после смены IP
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    resolver_timeout 10s;

    # Прокси для Supabase (обход блокировок в РФ)
    # ^~ — обязателен: без него regex ниже (.jpg, .png ...) перехватывает Storage-запросы
    # set $upstream — заставляет nginx переспрашивать DNS при каждом запросе
    location ^~ /supabase-proxy/ {
        set $upstream https://mtigcxqcymxvqjjqfyts.supabase.co;
        # rewrite обязателен при proxy_pass с переменной: иначе nginx не срезает префикс /supabase-proxy/
        rewrite ^/supabase-proxy/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name mtigcxqcymxvqjjqfyts.supabase.co;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host mtigcxqcymxvqjjqfyts.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Явно пробрасываем заголовки аутентификации Supabase
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Prefer $http_prefer;
        proxy_set_header Content-Profile $http_content_profile;
        proxy_set_header Accept-Profile $http_accept_profile;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Запрещаем браузеру кешировать API-ответы
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # index.html — всегда свежий (PWA берёт новый SW при каждом заходе)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Service worker — тоже без кеша
    location ~* (sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback — все маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики с хешами в именах (Vite content-hash → безопасно кешировать)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
